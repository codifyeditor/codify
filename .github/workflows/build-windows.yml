name: Build Codify Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build optimized native app
        run: cargo build --release
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codify-windows-installer
          path: |
            target/release/codify.exe
            Output/Codify-Setup.exe
          if-no-files-found: error
      - name: Attach executable and installer to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/codify.exe
            Output/Codify-Setup.exe
